name: Pruebas de carga

on:
  workflow_dispatch:
    inputs:
      usuarios:
        description: "Usuarios concurrentes"
        default: "50"
        required: false
      duracion:
        description: "Duración (ej. 2m)"
        default: "2m"
        required: false

jobs:
  locust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Levantar la API
        run: docker compose up -d --build api
      - name: Esperar /health
        run: timeout 120 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
      - name: Instalar Locust
        run: python -m pip install locust==2.31.8
      - name: Escenario headless
        run: >
          locust -f carga/locustfile.py --host http://localhost:8000 --headless
          -u ${{ inputs.usuarios }} -r 10 -t ${{ inputs.duracion }}
          --csv carga/resultados/carga --html carga/resultados/reporte.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reporte-carga
          path: carga/resultados/
      - name: Bajar el stack
        if: always()
        run: docker compose down -v
