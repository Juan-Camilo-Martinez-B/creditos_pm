# [RA] CI de CrediCheck. Acciones fijadas por SHA (semana 6 y 7).
name: CI CrediCheck

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas-unitarias:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest # Quality Gate de cobertura (>= 80 %)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cobertura
          path: |
            backend/coverage.xml
            backend/htmlcov/

  pruebas-contrato:
    needs: pruebas-unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose --profile pruebas run --rm --build test-runner
      - if: always()
        run: docker compose --profile pruebas down -v
